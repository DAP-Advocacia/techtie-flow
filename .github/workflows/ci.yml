name: CI

# Duas verificações em todo push e pull request na main:
#  1. sintaxe de todo arquivo .js (rápida, pega erro de digitação);
#  2. a suíte completa (`npm test`): motor de permissões, regras puras, telas num DOM simulado e API contra Postgres real.
#     Os testes de banco sobem um Postgres descartável em Docker (o runner do GitHub já traz Docker); ver docs/testes.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checa sintaxe de todo arquivo .js do projeto (exceto node_modules)
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./dist/*" -print0 \
            | xargs -0 -n1 node -c

  test:
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baixa a imagem do Postgres usada pelos testes de banco
        run: docker pull postgres:16-alpine
      - name: Suíte completa
        run: npm test
